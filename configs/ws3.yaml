# Jobs of workstream 3 (cross-linguistic probing), run with:
#   HLT_HF_REVISION=<feature commit> PYTHONPATH=src python scripts/10_run_probing.py --config configs/ws3.yaml
# Format: see configs/ws1.yaml and scripts/10_run_probing.py.
#
# X2 (#28): the same frozen multilingual encoder on English and Italian.
#   train ewt  -> evaluated on ewt test and pud_en
#   train isdt -> evaluated on isdt test and pud_it
# X3 (#29) adds mgpt jobs below the mbert ones.
defaults:
  pooling: first
  tasks: [upos, control]
  eval_treebanks: null      # train treebank plus the PUD of its language
  layers: null              # all layers 0..L
  max_train_rows: 50000
  seed: 42

jobs:
  - model: mbert
    train_treebank: ewt
    probe: linear
    init: pretrained

  - model: mbert
    train_treebank: isdt
    probe: linear
    init: pretrained
