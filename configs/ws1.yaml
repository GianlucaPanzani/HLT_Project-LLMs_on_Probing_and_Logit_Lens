defaults:
  train_treebank: ewt
  pooling: first
  tasks: [upos, control]
  eval_treebanks: null
  layers: null
  max_train_rows: 50000
  seed: 42

jobs:
  - model: bert
    probe: linear
    init: pretrained

  - model: bert
    probe: linear
    init: random

  - model: bert
    probe: mlp
    init: pretrained

  - model: bert
    probe: mlp
    init: random

  - model: distilbert
    probe: linear
    init: pretrained

  - model: distilbert
    probe: linear
    init: random

  - model: distilbert
    probe: mlp
    init: pretrained

  - model: distilbert
    probe: mlp
    init: random

  - model: gpt2
    probe: linear
    init: pretrained

  - model: gpt2
    probe: linear
    init: random

  - model: gpt2
    probe: mlp
    init: pretrained

  - model: gpt2
    probe: mlp
    init: random