name: CI

# Kept deliberately cheap for a private repo:
# - runs only on pull requests to main (not on every push)
# - skips docs, notebooks and data-only changes
# - cancels outdated runs of the same PR
# - no torch/transformers install: tests that need them must use pytest.importorskip
on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "app/**"
      - "ruff.toml"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/workflows/ci.yml
      - run: pip install ruff pytest numpy pandas pyarrow pyyaml scikit-learn
      - run: ruff check src tests scripts app
      - name: Tests (exit code 5 means no tests collected yet, which is fine)
        env:
          PYTHONPATH: src
        run: pytest -q -m "not slow" || [ $? -eq 5 ]
